name: CI

on:
  workflow_call:
    inputs:
      e2e_base_url:
        description: Base URL the browser tests serve on; must match the port in playwright.config.ts.
        type: string
        default: http://127.0.0.1:3100
      boot_env:
        description: Extra KEY=VALUE lines (one per line) added to the environment for the production boot smoke test.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  quality-code:
    name: Quality code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Dead code and unused dependencies
        run: npm run knip

  build:
    name: Build
    needs: quality-code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: First load budget
        run: npm run size

      - name: Add any extra production environment for the boot check
        if: ${{ inputs.boot_env != '' }}
        run: |
          echo "${{ inputs.boot_env }}" >> "$GITHUB_ENV"

      - name: Boot what production would install, and call it
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          API_HOST: 127.0.0.1
          API_PORT: '3400'
          WEB_ORIGIN: https://app.example
          BETTER_AUTH_URL: https://app.example
          BETTER_AUTH_SECRET: ci-only-secret-not-used-for-any-session
          GOOGLE_CLIENT_ID: ci-only-not-a-real-client
          GOOGLE_CLIENT_SECRET: ci-only-not-a-real-secret
        run: |
          npm ci --omit=dev --omit=optional --ignore-scripts

          node dist/api/server/index.js &
          booted=$!

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3400/api/health -o health.json; then break; fi
            sleep 1
          done

          echo "health: $(cat health.json)"
          grep -q '"database":"up"' health.json

          test "$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:3400/)" = 200
          curl -fsS http://127.0.0.1:3400/server/index.js | grep -q '<!doctype html>'

          kill "$booted" || true

  unit-test:
    name: Unit test
    needs: quality-code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      WEB_ORIGIN: http://localhost:5173
      BETTER_AUTH_URL: http://localhost:5173
      BETTER_AUTH_SECRET: ci-only-secret-not-used-for-any-session

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the dependencies
        run: npm ci

      - name: Check the migrations still describe the schema
        run: npm run db:check

      - name: Test, with the coverage thresholds
        run: npm test

  e2e:
    name: E2E
    needs: [build, unit-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      WEB_ORIGIN: ${{ inputs.e2e_base_url }}
      BETTER_AUTH_URL: ${{ inputs.e2e_base_url }}
      BETTER_AUTH_SECRET: ci-only-secret-not-used-for-any-session

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the journeys
        run: npm run e2e

      - name: Keep what failed
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-results
          path: e2e/.results
          include-hidden-files: true
          retention-days: 7

  code-scan:
    name: Code scan
    needs: quality-code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Load the queries
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - '**/__tests__/**'
              - '**/*.test.ts'
              - '**/*.fuzz.test.ts'
              - 'e2e/**'
              - 'scripts/**'

      - name: Look for what they describe
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  security:
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Audit what production ships
        run: npm audit --omit=dev --omit=optional --audit-level=high

      - name: Audit the tooling, without blocking on it
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Scan the history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
